name: GHCR Retention

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (report only, no deletes)
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "43 6 * * *"

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_NAME: odoo-docker
      KEEP_SHA_COUNT: "10"
      KEEP_UNTAGGED_DAYS: "7"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read validated image variants
        id: variants
        run: |
          set -euo pipefail
          variants="$(python3 -c 'import json, runpy; from dataclasses import asdict; from pathlib import Path; module = runpy.run_path("scripts/promote-published-images.py"); print(json.dumps([asdict(variant) for variant in module["read_variants"](Path("image-variants.json"))]))')"
          echo "value=${variants}" >> "${GITHUB_OUTPUT}"
      - name: Prune old GHCR versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          IMAGE_VARIANTS: ${{ steps.variants.outputs.value }}
        with:
          script: |
            const packageName = process.env.PACKAGE_NAME;
            const keepShaCount = Number.parseInt(process.env.KEEP_SHA_COUNT || "10", 10);
            const keepUntaggedDays = Number.parseInt(process.env.KEEP_UNTAGGED_DAYS || "7", 10);
            const dryRun = String(process.env.DRY_RUN).toLowerCase() === "true";
            const variants = JSON.parse(process.env.IMAGE_VARIANTS);
            const owner = context.repo.owner;
            const ownerType = String(context.payload.repository?.owner?.type || "User").toLowerCase();

            const listRoute = ownerType === "organization"
              ? "GET /orgs/{org}/packages/container/{package_name}/versions"
              : "GET /users/{username}/packages/container/{package_name}/versions";
            const deleteRoute = ownerType === "organization"
              ? "DELETE /orgs/{org}/packages/container/{package_name}/versions/{package_version_id}"
              : "DELETE /users/{username}/packages/container/{package_name}/versions/{package_version_id}";

            const listParameters = ownerType === "organization"
              ? { org: owner, package_name: packageName, per_page: 100 }
              : { username: owner, package_name: packageName, per_page: 100 };

            const versions = await github.paginate(listRoute, listParameters);
            versions.sort((left, right) => new Date(right.created_at) - new Date(left.created_at));
            const keepUntaggedCutoffEpochMilliseconds = Date.now() - (keepUntaggedDays * 24 * 60 * 60 * 1000);

            const taggedVersions = versions.filter((version) =>
              Array.isArray(version?.metadata?.container?.tags)
              && version.metadata.container.tags.length > 0,
            );
            const untaggedVersions = versions.filter((version) =>
              !Array.isArray(version?.metadata?.container?.tags)
              || version.metadata.container.tags.length === 0,
            );

            const keepIds = new Set();
            const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const keepTagRegexes = [/^[1-9][0-9]*\.[0-9]+-(runtime|devtools)$/];
            keepTagRegexes.push(...variants.flatMap((variant) => {
              const prefix = escapeRegex(variant.alias_prefix);
              return [
                new RegExp(`^${prefix}nightly-(runtime|devtools)$`),
                new RegExp(`^${prefix}nightly-\\d{8}-(runtime|devtools)$`),
                new RegExp(`^buildcache-${prefix}(runtime|devtools)$`),
              ];
            }));

            const shouldKeepByTag = (tags) =>
              tags.some((tag) => keepTagRegexes.some((regex) => regex.test(tag)));

            for (const version of taggedVersions) {
              const tags = version.metadata.container.tags;
              if (shouldKeepByTag(tags)) {
                keepIds.add(version.id);
              }
            }

            for (const variant of variants) {
              const namespace = escapeRegex(variant.alias_prefix);
              for (const suffix of ["runtime", "devtools"]) {
                for (const prefix of ["sha", "build", "candidate"]) {
                  const immutableRegex = prefix === "sha"
                    ? new RegExp(`^${namespace}sha-[0-9a-f]+-${suffix}$`)
                    : new RegExp(`^${namespace}${prefix}-[0-9]+-[0-9a-f]+-${suffix}$`);
                  const recentVersions = taggedVersions.filter((version) =>
                    version.metadata.container.tags.some((tag) => immutableRegex.test(tag)),
                  );
                  for (const version of recentVersions.slice(0, keepShaCount)) {
                    keepIds.add(version.id);
                  }
                }
              }
            }

            const versionByDigest = new Map(
              versions
                .filter((version) => String(version.name || "").startsWith("sha256:"))
                .map((version) => [version.name, version]),
            );
            const retainedVersions = versions.filter((version) => keepIds.has(version.id)
              || (untaggedVersions.includes(version)
                && !(Date.parse(version.created_at) < keepUntaggedCutoffEpochMilliseconds)));
            const manifestTypes = new Set([
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
            ]);
            const inspectedDigests = new Set();
            const retainedChildDigests = new Set();
            const retainedChildParents = new Map();
            const retainedIndexChildren = new Map();
            const missingRetainedChildren = [];

            for (const version of retainedVersions) {
              if (inspectedDigests.has(version.name)) continue;
              inspectedDigests.add(version.name);
              const imageReference = `ghcr.io/${owner.toLowerCase()}/${packageName}@${version.name}`;
              const inspection = await exec.getExecOutput(
                "docker",
                ["buildx", "imagetools", "inspect", "--raw", imageReference],
                { ignoreReturnCode: true, silent: true },
              );
              if (inspection.exitCode !== 0) {
                core.setFailed(`Unable to inspect retained image dependency graph for ${version.name}.`);
                return;
              }

              let manifest;
              try {
                manifest = JSON.parse(inspection.stdout);
              } catch (error) {
                core.setFailed(`Retained image ${version.name} returned invalid manifest JSON.`);
                return;
              }

              const indexChildren = [];
              for (const child of manifest.manifests || []) {
                if (!manifestTypes.has(child.mediaType)) continue;
                if (typeof child?.digest === "string" && child.digest.startsWith("sha256:")) {
                  indexChildren.push(child.digest);
                  retainedChildDigests.add(child.digest);
                  const parents = retainedChildParents.get(child.digest) || [];
                  parents.push(version.name);
                  retainedChildParents.set(child.digest, parents);
                  if (child.mediaType.endsWith("index.v1+json") || child.mediaType.endsWith("manifest.list.v2+json")) {
                    retainedVersions.push({ name: child.digest });
                  }
                }
              }
              retainedIndexChildren.set(version.name, indexChildren);
            }

            for (const digest of retainedChildDigests) {
              const childVersion = versionByDigest.get(digest);
              if (!childVersion) {
                const childReference = `ghcr.io/${owner.toLowerCase()}/${packageName}@${digest}`;
                const childInspection = await exec.getExecOutput(
                  "docker",
                  ["buildx", "imagetools", "inspect", childReference],
                  { ignoreReturnCode: true, silent: true },
                );
                const childInspectionOutput = `${childInspection.stdout}\n${childInspection.stderr}`.trim();
                if (
                  childInspection.exitCode !== 0
                  && childInspectionOutput === `ERROR: ${childReference}: not found`
                ) {
                  missingRetainedChildren.push({
                    digest,
                    parents: retainedChildParents.get(digest) || [],
                  });
                  continue;
                }
                core.setFailed(`Retained image dependency ${digest} cannot be reconciled with the package inventory.`);
                return;
              }
              keepIds.add(childVersion.id);
            }

            const missingChildDigests = new Set(missingRetainedChildren.map((child) => child.digest));
            const brokenIndexes = taggedVersions.filter((version) => {
              const children = retainedIndexChildren.get(version.name) || [];
              return keepIds.has(version.id)
                && children.length > 0
                && children.every((digest) => missingChildDigests.has(digest));
            });
            const brokenIndexNames = new Set(brokenIndexes.map((version) => version.name));
            for (const version of brokenIndexes) {
              keepIds.delete(version.id);
            }

            for (const missingChild of missingRetainedChildren) {
              if (missingChild.parents.every((parent) => brokenIndexNames.has(parent))) {
                continue;
              }
              core.warning(
                `Retained image dependency ${missingChild.digest} is already missing from GHCR; `
                + `parent indexes: ${missingChild.parents.join(",") || "unknown"}.`,
              );
            }

            const deleteTaggedVersions = taggedVersions.filter((version) => !keepIds.has(version.id));
            const deleteUntaggedVersions = untaggedVersions.filter((version) => {
              const createdAtEpochMilliseconds = Date.parse(version.created_at);
              return !keepIds.has(version.id)
                && Number.isFinite(createdAtEpochMilliseconds)
                && createdAtEpochMilliseconds < keepUntaggedCutoffEpochMilliseconds;
            });
            const deleteVersions = [...deleteTaggedVersions, ...deleteUntaggedVersions];

            core.info(`Package: ${packageName}`);
            core.info(`Owner: ${owner} (${ownerType})`);
            core.info(`Tagged versions found: ${taggedVersions.length}`);
            core.info(`Tagged versions kept: ${taggedVersions.filter((version) => keepIds.has(version.id)).length}`);
            core.info(`Tagged versions to delete: ${deleteTaggedVersions.length}`);
            core.info(`Unpullable indexes to delete: ${brokenIndexes.length}`);
            core.info(`Untagged versions found: ${untaggedVersions.length}`);
            core.info(`Untagged retention window days: ${keepUntaggedDays}`);
            core.info(`Untagged versions to delete: ${deleteUntaggedVersions.length}`);
            core.info(`Dry run: ${dryRun}`);

            for (const version of deleteVersions) {
              const tags = Array.isArray(version?.metadata?.container?.tags)
                && version.metadata.container.tags.length > 0
                ? version.metadata.container.tags.join(",")
                : "<untagged>";
              if (dryRun) {
                core.info(`[dry-run] delete id=${version.id} tags=${tags}`);
                continue;
              }

              const deleteParameters = ownerType === "organization"
                ? { org: owner, package_name: packageName, package_version_id: version.id }
                : { username: owner, package_name: packageName, package_version_id: version.id };

              await github.request(deleteRoute, deleteParameters);
              core.info(`deleted id=${version.id} tags=${tags}`);
            }
