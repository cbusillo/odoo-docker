name: Build And Publish Images

on:
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish stable versioned tags in addition to sha/nightly tags.
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/launchplane/train/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/launchplane/train/') }}

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false
  PYTHON_VERSION: 3.13.15
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  dockerfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Test registry retention decisions
        run: |
          bash scripts/test-ghcr-retention.sh
          bash scripts/test-published-promotion.sh

      - name: Run Hadolint
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            -w /work \
            hadolint/hadolint:v2.14.0 \
            hadolint Dockerfile

  resolve_source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      odoo_source_revs: ${{ steps.odoo_source.outputs.revisions }}
      variants: ${{ steps.odoo_source.outputs.variants }}
      nightly_date: ${{ steps.odoo_source.outputs.nightly_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve Odoo source revisions
        id: odoo_source
        run: |
          set -euo pipefail
          variants="$(python3 -c 'import json, runpy; from dataclasses import asdict; from pathlib import Path; module = runpy.run_path("scripts/promote-published-images.py"); print(json.dumps([asdict(variant) for variant in module["read_variants"](Path("image-variants.json"))]))')"
          revisions='{}'
          while IFS= read -r series; do
            source_revision="$(git ls-remote https://github.com/odoo/odoo.git "refs/heads/${series}" | awk '{print $1}')"
            if [[ ! "${source_revision}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Failed to resolve Odoo source revision for ${series}" >&2
              exit 1
            fi
            revisions="$(jq -cn --argjson revisions "${revisions}" --arg series "${series}" --arg revision "${source_revision}" '$revisions + {($series): $revision}')"
          done < <(jq -r '.[].series' <<<"${variants}")
          {
            echo "revisions=${revisions}"
            echo "variants=${variants}"
            echo "nightly_date=$(date -u +%Y%m%d)"
          } >> "${GITHUB_OUTPUT}"

  resolve_inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      apt_snapshot: ${{ steps.inputs.outputs.apt_snapshot }}
      postgresql_client_common_version: ${{ steps.inputs.outputs.postgresql_client_common_version }}
      postgresql_client_version: ${{ steps.inputs.outputs.postgresql_client_version }}
      postgresql_libpq_version: ${{ steps.inputs.outputs.postgresql_libpq_version }}
      resolver_cutoff: ${{ steps.inputs.outputs.resolver_cutoff }}
      scan_configuration_sha256: ${{ steps.inputs.outputs.scan_configuration_sha256 }}
      trivy_db_sha256: ${{ steps.inputs.outputs.trivy_db_sha256 }}
      trivy_image: ${{ steps.inputs.outputs.trivy_image }}
      trivy_version: ${{ steps.inputs.outputs.trivy_version }}
      candidate_scan_configuration_sha256: ${{ steps.inputs.outputs.candidate_scan_configuration_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Validate dependency-health tooling
        run: scripts/test-image-dependency-health.sh

      - name: Resolve comparison inputs and scanner database
        id: inputs
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          TRAIN_CANDIDATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'launchplane/train/') }}
        run: |
          set -euo pipefail

          resolver_cutoff="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:00:00Z')"
          apt_snapshot="$(date -u -d '24 hours ago' '+%Y%m%dT%H0000Z')"
          ubuntu_image="$(sed -n 's/^FROM \(ubuntu:noble@sha256:[0-9a-f]\{64\}\) AS runtime-system$/\1/p' Dockerfile)"
          trivy_image="${TRIVY_IMAGE}"

          if [ -n "${BASELINE_COMMIT}" ]; then
            git fetch --no-tags --depth 1 origin "${BASELINE_COMMIT}"
            if git cat-file -e "${BASELINE_COMMIT}:scripts/scan-image-dependencies.sh" 2>/dev/null \
              && ! git diff --quiet "${BASELINE_COMMIT}" HEAD -- \
                .github/workflows/build.yml \
                scripts/image-dependency-health.py \
                scripts/scan-image-dependencies.sh; then
              trivy_image="$(git show "${BASELINE_COMMIT}:.github/workflows/build.yml" \
                | sed -n 's/^  TRIVY_IMAGE: //p' \
                | head -n 1)"
            fi
          fi
          scanner_images=("${trivy_image}")
          if [ "${TRAIN_CANDIDATE}" = "true" ]; then
            scanner_images+=("${TRIVY_IMAGE}")
          fi
          for image in "${scanner_images[@]}"; do
            if [[ ! "${image}" =~ ^aquasec/trivy:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "Resolved Trivy image is not an approved immutable reference" >&2
              exit 1
            fi
          done
          resolve_scanner() {
            local image="$1" cache="$2"
            mkdir -p "${cache}"
            docker run --rm \
              --volume "${cache}:/root/.cache/trivy" \
              "${image}" image --cache-dir /root/.cache/trivy --download-db-only
            resolved_trivy_version="$(docker run --rm "${image}" --version --format json | jq -er '.Version')"
            resolved_trivy_db_sha256="$(cd "${cache}" \
              && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          }

          postgresql_versions="$(docker run --rm --platform linux/amd64 \
            --env APT_SNAPSHOT="${apt_snapshot}" \
            --volume /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            "${ubuntu_image}" \
            bash -euo pipefail -c '
              snapshot_url="https://snapshot.ubuntu.com/ubuntu/${APT_SNAPSHOT}/"
              sed -i \
                -e "s|http:/[/]archive.ubuntu.com/ubuntu/|${snapshot_url}|g" \
                -e "s|http:/[/]security.ubuntu.com/ubuntu/|${snapshot_url}|g" \
                /etc/apt/sources.list.d/ubuntu.sources
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends curl >/dev/null
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                -o /usr/share/keyrings/postgresql.asc
              echo "deb [signed-by=/usr/share/keyrings/postgresql.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" \
                >/etc/apt/sources.list.d/pgdg.list
              apt-get update >/dev/null
              for package in postgresql-client-17 postgresql-client-common libpq5; do
                apt-cache madison "${package}" >"/tmp/${package}-versions"
                IFS="|" read -r _ version _ <"/tmp/${package}-versions"
                version="$(echo "${version}" | xargs)"
                echo "${package}=${version}"
              done
            ')"
          postgresql_client_version="$(sed -n 's/^postgresql-client-17=//p' <<<"${postgresql_versions}")"
          postgresql_client_common_version="$(sed -n 's/^postgresql-client-common=//p' <<<"${postgresql_versions}")"
          postgresql_libpq_version="$(sed -n 's/^libpq5=//p' <<<"${postgresql_versions}")"
          if [ -z "${postgresql_client_version}" ] \
            || [ -z "${postgresql_client_common_version}" ] \
            || [ -z "${postgresql_libpq_version}" ]; then
            echo "Failed to resolve exact PostgreSQL package set" >&2
            exit 1
          fi

          trivy_cache="${RUNNER_TEMP}/trivy-cache"
          resolve_scanner "${trivy_image}" "${trivy_cache}"
          trivy_version="${resolved_trivy_version}"
          trivy_db_sha256="${resolved_trivy_db_sha256}"

          mkdir -p "${RUNNER_TEMP}/dependency-health-inputs"
          jq -cn \
            --arg apt_snapshot "${apt_snapshot}" \
            --arg postgresql_client_common_version "${postgresql_client_common_version}" \
            --arg postgresql_client_version "${postgresql_client_version}" \
            --arg postgresql_libpq_version "${postgresql_libpq_version}" \
            --arg python_version "${PYTHON_VERSION}" \
            --arg resolver_cutoff "${resolver_cutoff}" \
            --arg trivy_db_sha256 "${trivy_db_sha256}" \
            --arg trivy_image "${trivy_image}" \
            --arg trivy_version "${trivy_version}" \
            '{
              apt_snapshot: $apt_snapshot,
              postgresql_packages: {
                client: $postgresql_client_version,
                client_common: $postgresql_client_common_version,
                libpq: $postgresql_libpq_version
              },
              python_version: $python_version,
              resolver_cutoff: $resolver_cutoff,
              scanner: {
                image: $trivy_image,
                version: $trivy_version,
                databases_sha256: $trivy_db_sha256,
                scanners: ["vulnerability"],
                severities: ["LOW", "MEDIUM", "HIGH", "CRITICAL"],
                ignore_unfixed: true,
                ignorefile: "/dev/null",
                skipped_files: [
                  "/usr/share/java/gettext.jar",
                  "/usr/share/java/libintl-0.21.jar"
                ],
                skip_java_database: true
              }
            }' >"${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json"
          scan_configuration_sha256="$(sha256sum \
            "${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json" \
            | awk '{print $1}')"

          tar -C "${RUNNER_TEMP}" -czf \
            "${RUNNER_TEMP}/dependency-health-inputs/trivy-cache.tar.gz" \
            trivy-cache

          if [ "${TRAIN_CANDIDATE}" = "true" ]; then
            candidate_trivy_version="${trivy_version}"
            candidate_trivy_db_sha256="${trivy_db_sha256}"
            if [ "${TRIVY_IMAGE}" != "${trivy_image}" ]; then
              resolve_scanner "${TRIVY_IMAGE}" "${RUNNER_TEMP}/trivy-candidate-cache"
              candidate_trivy_version="${resolved_trivy_version}"
              candidate_trivy_db_sha256="${resolved_trivy_db_sha256}"
              tar -C "${RUNNER_TEMP}" -czf \
                "${RUNNER_TEMP}/dependency-health-inputs/candidate-trivy-cache.tar.gz" \
                trivy-candidate-cache
            fi
            jq \
              --arg image "${TRIVY_IMAGE}" \
              --arg version "${candidate_trivy_version}" \
              --arg databases_sha256 "${candidate_trivy_db_sha256}" \
              '.scanner.image = $image | .scanner.version = $version | .scanner.databases_sha256 = $databases_sha256' \
              "${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json" \
              >"${RUNNER_TEMP}/dependency-health-inputs/candidate-inputs.json"
            echo "candidate_scan_configuration_sha256=$(sha256sum \
              "${RUNNER_TEMP}/dependency-health-inputs/candidate-inputs.json" | awk '{print $1}')" >>"${GITHUB_OUTPUT}"
          fi

          {
            echo "apt_snapshot=${apt_snapshot}"
            echo "postgresql_client_common_version=${postgresql_client_common_version}"
            echo "postgresql_client_version=${postgresql_client_version}"
            echo "postgresql_libpq_version=${postgresql_libpq_version}"
            echo "resolver_cutoff=${resolver_cutoff}"
            echo "scan_configuration_sha256=${scan_configuration_sha256}"
            echo "trivy_db_sha256=${trivy_db_sha256}"
            echo "trivy_image=${trivy_image}"
            echo "trivy_version=${trivy_version}"
          } >>"${GITHUB_OUTPUT}"

      - name: Upload comparison inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-health-inputs
          path: ${{ runner.temp }}/dependency-health-inputs
          if-no-files-found: error

  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, chris-testing-build]
    timeout-minutes: 90
    needs: [resolve_source, resolve_inputs]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: ${{ fromJSON(needs.resolve_source.outputs.variants) }}
        target: [runtime, runtime-devtools]
        include:
          - target: runtime
            suffix: runtime
            smoke_script: scripts/smoke-runtime.sh
          - target: runtime-devtools
            suffix: devtools
            smoke_script: scripts/smoke-devtools.sh
    env:
      ODOO_SERIES: ${{ matrix.variant.series }}
      ODOO_SOURCE_REV: ${{ fromJSON(needs.resolve_source.outputs.odoo_source_revs)[matrix.variant.series] }}
      ALIAS_PREFIX: ${{ matrix.variant.alias_prefix }}
      VARIANT_KEY: ${{ matrix.variant.series }}-${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check selected source requirement overrides
        run: |
          set -euo pipefail
          uv run --no-project --python "${PYTHON_VERSION}" --with packaging bash scripts/test-check-requirements-overrides.sh
          curl -fsSL "https://raw.githubusercontent.com/odoo/odoo/${ODOO_SOURCE_REV}/requirements.txt" -o "${RUNNER_TEMP}/odoo-requirements-${ODOO_SERIES}.txt"
          uv run --no-project --python "${PYTHON_VERSION}" --with packaging python scripts/check-requirements-overrides.py --requirements "${RUNNER_TEMP}/odoo-requirements-${ODOO_SERIES}.txt" --overrides requirements-overrides.txt --python-version "${PYTHON_VERSION%.*}"

      - name: Materialize exact pull-request baseline
        if: github.event_name == 'pull_request'
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${BASELINE_ROOT}"
          git fetch --no-tags --depth 1 origin "${BASELINE_COMMIT}"
          git archive "${BASELINE_COMMIT}" | tar -x -C "${BASELINE_ROOT}"

      - name: Detect native resolver and scanner parity
        id: resolver_parity
        if: github.event_name == 'pull_request'
        env:
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
        run: |
          set -euo pipefail
          resolver_parity="false"
          if grep -q '^ARG APT_SNAPSHOT$' "${BASELINE_ROOT}/Dockerfile" \
            && grep -q '^ARG POSTGRESQL_CLIENT_VERSION$' "${BASELINE_ROOT}/Dockerfile" \
            && grep -q '^ARG POSTGRESQL_CLIENT_COMMON_VERSION$' "${BASELINE_ROOT}/Dockerfile" \
            && grep -q '^ARG POSTGRESQL_LIBPQ_VERSION$' "${BASELINE_ROOT}/Dockerfile" \
            && grep -q '^ARG RESOLVER_CUTOFF$' "${BASELINE_ROOT}/Dockerfile"; then
            resolver_parity="true"
          fi

          scanner_available="true"
          scanner_parity="true"
          for path in \
            .github/workflows/build.yml \
            scripts/image-dependency-health.py \
            scripts/scan-image-dependencies.sh
          do
            if [ ! -f "${BASELINE_ROOT}/${path}" ]; then
              scanner_available="false"
              scanner_parity="false"
            elif ! cmp -s "${BASELINE_ROOT}/${path}" "${path}"; then
              scanner_parity="false"
            fi
          done

          comparison_parity="false"
          resolver_contract="false"
          if [ "$(grep -c '^ARG APT_SNAPSHOT$' "${BASELINE_ROOT}/Dockerfile")" -ge 2 ] \
            && [ "$(grep -c '^ARG POSTGRESQL_CLIENT_VERSION$' "${BASELINE_ROOT}/Dockerfile")" -ge 2 ] \
            && [ "$(grep -c '^ARG POSTGRESQL_CLIENT_COMMON_VERSION$' "${BASELINE_ROOT}/Dockerfile")" -ge 2 ] \
            && [ "$(grep -c '^ARG POSTGRESQL_LIBPQ_VERSION$' "${BASELINE_ROOT}/Dockerfile")" -ge 2 ] \
            && [ "$(grep -c '^ARG RESOLVER_CUTOFF$' "${BASELINE_ROOT}/Dockerfile")" -ge 2 ] \
            && grep -q 'ubuntu:noble@sha256:' "${BASELINE_ROOT}/Dockerfile" \
            && grep -Fq "snapshot.ubuntu.com/ubuntu/\${APT_SNAPSHOT}" "${BASELINE_ROOT}/Dockerfile" \
            && grep -q 'apt-archive.postgresql.org' "${BASELINE_ROOT}/Dockerfile" \
            && grep -q 'UV_EXCLUDE_NEWER' "${BASELINE_ROOT}/Dockerfile"; then
            resolver_contract="true"
          fi
          if [ -f "${BASELINE_ROOT}/image-variants.json" ] && jq -e --arg series "${ODOO_SERIES}" 'any(.[]; .series == $series)' "${BASELINE_ROOT}/image-variants.json" >/dev/null \
            && [ "${resolver_parity}" = "true" ] \
            && [ "${resolver_contract}" = "true" ] \
            && [ "${scanner_parity}" = "true" ]; then
            comparison_parity="true"
          fi

          {
            echo "value=${resolver_parity}"
            echo "scanner_available=${scanner_available}"
            echo "scanner_parity=${scanner_parity}"
            echo "resolver_contract=${resolver_contract}"
            echo "comparison=${comparison_parity}"
          } >>"${GITHUB_OUTPUT}"
          echo "Native base/head resolver parity: ${resolver_parity}"
          echo "Baseline resolver contract complete: ${resolver_contract}"
          echo "Trusted baseline scanner available: ${scanner_available}"
          echo "Base/head scanner parity: ${scanner_parity}"
          echo "Causal comparison eligible: ${comparison_parity}"

      - name: Download comparison inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dependency-health-inputs
          path: ${{ runner.temp }}/dependency-health-inputs

      - name: Restore scanner database
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TEMP}/trivy-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ env.VARIANT_KEY }}"
          mkdir -p "${cache_root}"
          tar -C "${cache_root}" --strip-components=1 -xzf \
            "${RUNNER_TEMP}/dependency-health-inputs/trivy-cache.tar.gz"
          actual_db_sha256="$(cd "${cache_root}" \
            && find . -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | awk '{print $1}')"
          if [ "${actual_db_sha256}" != "${{ needs.resolve_inputs.outputs.trivy_db_sha256 }}" ]; then
            echo "Restored Trivy database digest does not match resolved inputs" >&2
            exit 1
          fi
          actual_configuration_sha256="$(sha256sum \
            "${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json" \
            | awk '{print $1}')"
          if [ "${actual_configuration_sha256}" != "${{ needs.resolve_inputs.outputs.scan_configuration_sha256 }}" ]; then
            echo "Restored scan configuration digest does not match resolved inputs" >&2
            exit 1
          fi

      - id: setup_buildx_verify
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          name: odoo-docker-chris-testing
          cleanup: false
          keep-state: true

      - name: Validate odoo-bin wrapper behavior
        run: scripts/test-odoo-bin-wrapper.sh

      - name: Build baseline image
        if: github.event_name == 'pull_request' && steps.resolver_parity.outputs.comparison == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.setup_buildx_verify.outputs.name }}
          context: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          file: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}/Dockerfile
          target: ${{ matrix.target }}
          pull: true
          load: true
          platforms: linux/amd64
          tags: odoo-docker:baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=${{ matrix.variant.series }}
            ODOO_SOURCE_REV=${{ env.ODOO_SOURCE_REV }}
            APT_REFRESH_EPOCH=${{ github.run_id }}
            APT_SNAPSHOT=${{ needs.resolve_inputs.outputs.apt_snapshot }}
            POSTGRESQL_CLIENT_COMMON_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_common_version }}
            POSTGRESQL_CLIENT_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_version }}
            POSTGRESQL_LIBPQ_VERSION=${{ needs.resolve_inputs.outputs.postgresql_libpq_version }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            RESOLVER_CUTOFF=${{ needs.resolve_inputs.outputs.resolver_cutoff }}

      - name: Build verification image (attempt 1)
        id: verify_build_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.setup_buildx_verify.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          load: true
          platforms: linux/amd64
          tags: odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=${{ matrix.variant.series }}
            ODOO_SOURCE_REV=${{ env.ODOO_SOURCE_REV }}
            APT_REFRESH_EPOCH=${{ github.run_id }}
            APT_SNAPSHOT=${{ needs.resolve_inputs.outputs.apt_snapshot }}
            POSTGRESQL_CLIENT_COMMON_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_common_version }}
            POSTGRESQL_CLIENT_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_version }}
            POSTGRESQL_LIBPQ_VERSION=${{ needs.resolve_inputs.outputs.postgresql_libpq_version }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            RESOLVER_CUTOFF=${{ needs.resolve_inputs.outputs.resolver_cutoff }}

      - name: Build verification image (attempt 2, no cache import)
        id: verify_build_attempt_2
        if: steps.verify_build_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.setup_buildx_verify.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          load: true
          no-cache: true
          platforms: linux/amd64
          tags: odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=${{ matrix.variant.series }}
            ODOO_SOURCE_REV=${{ env.ODOO_SOURCE_REV }}
            APT_REFRESH_EPOCH=${{ github.run_id }}
            APT_SNAPSHOT=${{ needs.resolve_inputs.outputs.apt_snapshot }}
            POSTGRESQL_CLIENT_COMMON_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_common_version }}
            POSTGRESQL_CLIENT_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_version }}
            POSTGRESQL_LIBPQ_VERSION=${{ needs.resolve_inputs.outputs.postgresql_libpq_version }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            RESOLVER_CUTOFF=${{ needs.resolve_inputs.outputs.resolver_cutoff }}

      - name: Fail verification build after retries
        if: steps.verify_build_attempt_1.outcome == 'failure' && steps.verify_build_attempt_2.outcome == 'failure'
        run: |
          echo "Verification build failed after two attempts" >&2
          exit 1

      - name: Smoke test verification image
        run: ${{ matrix.smoke_script }} odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }} "${ODOO_SERIES}"

      - name: Smoke test database initialization
        if: matrix.target == 'runtime'
        run: scripts/smoke-db-init.sh odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant.series }}-runtime

      - name: Smoke test database-bound readiness and Chromium
        if: matrix.target == 'runtime-devtools'
        run: bash scripts/smoke-readiness.sh odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant.series }}-devtools odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant.series }}-devtools

      - name: Validate downstream helper contract
        if: matrix.target == 'runtime'
        run: scripts/test-downstream-helpers.sh odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant.series }}-runtime

      - name: Record verification build provenance
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          COMPARISON_PARITY: ${{ steps.resolver_parity.outputs.comparison || 'false' }}
          RESOLVER_PARITY: ${{ steps.resolver_parity.outputs.value || 'false' }}
          SCANNER_PARITY: ${{ steps.resolver_parity.outputs.scanner_parity || 'false' }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/dependency-health-${{ env.VARIANT_KEY }}"
          mkdir -p "${evidence_root}"
          baseline_dockerfile_sha256=""
          if [ "${RESOLVER_PARITY}" = "true" ]; then
            baseline_dockerfile_sha256="$(sha256sum "${BASELINE_ROOT}/Dockerfile" | awk '{print $1}')"
          fi
          jq -cn \
            --slurpfile inputs "${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json" \
            --arg baseline_commit "${BASELINE_COMMIT}" \
            --arg baseline_dockerfile_sha256 "${baseline_dockerfile_sha256}" \
            --arg buildx_version "$(docker buildx version)" \
            --arg comparison_parity "${COMPARISON_PARITY}" \
            --arg docker_server_version "$(docker version --format '{{.Server.Version}}')" \
            --arg platform "linux/amd64" \
            --arg resolver_parity "${RESOLVER_PARITY}" \
            --arg scanner_parity "${SCANNER_PARITY}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            --arg source_dockerfile_sha256 "$(sha256sum Dockerfile | awk '{print $1}')" \
            --arg target "${{ matrix.target }}" \
            '{
              source_commit: $source_commit,
              baseline_commit: $baseline_commit,
              target: $target,
              platform: $platform,
              source_dockerfile_sha256: $source_dockerfile_sha256,
              baseline_dockerfile_sha256: $baseline_dockerfile_sha256,
              buildx_version: $buildx_version,
              docker_server_version: $docker_server_version,
              comparison_parity: ($comparison_parity == "true"),
              resolver_parity: ($resolver_parity == "true"),
              scanner_parity: ($scanner_parity == "true"),
              resolved_inputs: $inputs[0]
            }' >"${evidence_root}/build-provenance.json"

      - name: Scan candidate verification image
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          DEPENDENCY_HEALTH_REPOSITORY: ${{ github.repository }}
          SCAN_CONFIGURATION_SHA256: ${{ needs.resolve_inputs.outputs.scan_configuration_sha256 }}
          SCANNER_AVAILABLE: ${{ steps.resolver_parity.outputs.scanner_available || 'false' }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          TRIVY_DB_SHA256: ${{ needs.resolve_inputs.outputs.trivy_db_sha256 }}
          TRIVY_IMAGE: ${{ needs.resolve_inputs.outputs.trivy_image }}
          TRIVY_VERSION: ${{ needs.resolve_inputs.outputs.trivy_version }}
        run: |
          tooling_root="${GITHUB_WORKSPACE}"
          if [ "${SCANNER_AVAILABLE}" = "true" ]; then
            tooling_root="${BASELINE_ROOT}"
          fi
          bash "${tooling_root}/scripts/scan-image-dependencies.sh" \
            "odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}" \
            "${SOURCE_COMMIT}" \
            "${BASELINE_COMMIT}" \
            "image:${{ env.VARIANT_KEY }}:linux/amd64" \
            docker \
            "${RUNNER_TEMP}/dependency-health-${{ env.VARIANT_KEY }}/candidate"

      - name: Scan baseline verification image
        if: github.event_name == 'pull_request' && steps.resolver_parity.outputs.comparison == 'true'
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          DEPENDENCY_HEALTH_REPOSITORY: ${{ github.repository }}
          SCAN_CONFIGURATION_SHA256: ${{ needs.resolve_inputs.outputs.scan_configuration_sha256 }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          TRIVY_DB_SHA256: ${{ needs.resolve_inputs.outputs.trivy_db_sha256 }}
          TRIVY_IMAGE: ${{ needs.resolve_inputs.outputs.trivy_image }}
          TRIVY_VERSION: ${{ needs.resolve_inputs.outputs.trivy_version }}
        run: |
          bash "${BASELINE_ROOT}/scripts/scan-image-dependencies.sh" \
            "odoo-docker:baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}" \
            "${BASELINE_COMMIT}" \
            "" \
            "image:${{ env.VARIANT_KEY }}:linux/amd64" \
            docker \
            "${RUNNER_TEMP}/dependency-health-${{ env.VARIANT_KEY }}/baseline"

      - name: Evaluate causal dependency regression
        if: github.event_name == 'pull_request' && steps.resolver_parity.outputs.comparison == 'true'
        env:
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
        run: |
          python3 "${BASELINE_ROOT}/scripts/image-dependency-health.py" compare \
            --baseline "${RUNNER_TEMP}/dependency-health-${{ env.VARIANT_KEY }}/baseline/snapshot.json" \
            --candidate "${RUNNER_TEMP}/dependency-health-${{ env.VARIANT_KEY }}/candidate/snapshot.json" \
            --output "${RUNNER_TEMP}/dependency-health-${{ env.VARIANT_KEY }}/comparison.json"

      - name: Preserve absolute gate without trusted comparison parity
        id: trusted_absolute
        if: github.event_name != 'pull_request' || steps.resolver_parity.outputs.comparison != 'true'
        env:
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          SCANNER_AVAILABLE: ${{ steps.resolver_parity.outputs.scanner_available || 'false' }}
          HEALTH_ROOT: ${{ runner.temp }}/dependency-health-${{ env.VARIANT_KEY }}
        run: |
          tooling_root="${GITHUB_WORKSPACE}"
          if [ "${SCANNER_AVAILABLE}" = "true" ]; then
            tooling_root="${BASELINE_ROOT}"
          fi
          python3 "${tooling_root}/scripts/image-dependency-health.py" absolute \
            --snapshot "${HEALTH_ROOT}/candidate/snapshot.json" \
            --output "${HEALTH_ROOT}/absolute.json"

      - name: Enforce candidate-tooling absolute health before merge
        id: candidate_absolute
        env:
          TRAIN_CANDIDATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'launchplane/train/') }}
          SCANNER_PARITY: ${{ steps.resolver_parity.outputs.scanner_parity || 'false' }}
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || '' }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPENDENCY_HEALTH_REPOSITORY: ${{ github.repository }}
          CANDIDATE_CONFIGURATION_SHA256: ${{ needs.resolve_inputs.outputs.candidate_scan_configuration_sha256 }}
          BASE_TRIVY_IMAGE: ${{ needs.resolve_inputs.outputs.trivy_image }}
          BASE_TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          IMAGE_REFERENCE: odoo-docker:verify-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          SCAN_SCOPE: image:${{ env.VARIANT_KEY }}:linux/amd64
          HEALTH_ROOT: ${{ runner.temp }}/dependency-health-${{ env.VARIANT_KEY }}
        run: |
          set -euo pipefail
          if [ "${TRAIN_CANDIDATE}" != "true" ]; then
            exit 0
          fi
          evidence_root="${HEALTH_ROOT}/candidate-tooling"
          mkdir -p "${evidence_root}"
          if [ "${SCANNER_PARITY}" = "true" ]; then
            python3 scripts/image-dependency-health.py absolute \
              --snapshot "${HEALTH_ROOT}/candidate/snapshot.json" \
              --output "${evidence_root}/absolute.json"
            exit 0
          fi
          profile="${RUNNER_TEMP}/dependency-health-inputs/candidate-inputs.json"
          if [ "$(sha256sum "${profile}" | awk '{print $1}')" != "${CANDIDATE_CONFIGURATION_SHA256}" ]; then
            echo "Candidate scanner configuration digest does not match resolved inputs" >&2
            exit 1
          fi
          candidate_trivy_image="$(jq -er '.scanner.image' "${profile}")"
          if [ "${candidate_trivy_image}" != "${TRIVY_IMAGE}" ]; then
            echo "Candidate scanner image does not match the source pin" >&2
            exit 1
          fi
          cache_root="${BASE_TRIVY_CACHE_DIR}"
          if [ "${candidate_trivy_image}" != "${BASE_TRIVY_IMAGE}" ]; then
            cache_root="${BASE_TRIVY_CACHE_DIR}-candidate"
            mkdir -p "${cache_root}"
            tar -C "${cache_root}" --strip-components=1 -xzf \
              "${RUNNER_TEMP}/dependency-health-inputs/candidate-trivy-cache.tar.gz"
          fi
          expected_db_sha256="$(jq -er '.scanner.databases_sha256' "${profile}")"
          actual_db_sha256="$(cd "${cache_root}" \
            && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          if [ "${actual_db_sha256}" != "${expected_db_sha256}" ]; then
            echo "Candidate scanner database digest does not match resolved inputs" >&2
            exit 1
          fi
          TRIVY_CACHE_DIR="${cache_root}"
          TRIVY_VERSION="$(jq -er '.scanner.version' "${profile}")"
          TRIVY_DB_SHA256="${expected_db_sha256}"
          SCAN_CONFIGURATION_SHA256="${CANDIDATE_CONFIGURATION_SHA256}"
          export TRIVY_CACHE_DIR TRIVY_VERSION TRIVY_DB_SHA256 SCAN_CONFIGURATION_SHA256
          bash scripts/scan-image-dependencies.sh \
            "${IMAGE_REFERENCE}" "${SOURCE_COMMIT}" "${BASELINE_COMMIT}" \
            "${SCAN_SCOPE}" docker "${evidence_root}"
          python3 scripts/image-dependency-health.py absolute \
            --snapshot "${evidence_root}/snapshot.json" \
            --output "${evidence_root}/absolute.json"

      - name: Record successful verification of exact inputs
        id: verification_pass
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/dependency-health-${{ env.VARIANT_KEY }}"
          jq --arg series "${ODOO_SERIES}" --arg revision "${ODOO_SOURCE_REV}" --arg commit "${{ github.event.pull_request.head.sha || github.sha }}" --arg run_id "${GITHUB_RUN_ID}" --arg target "${{ matrix.target }}" --arg configuration "${{ needs.resolve_inputs.outputs.scan_configuration_sha256 }}" '.verification = {status: "pass", series: $series, odoo_source_revision: $revision, source_commit: $commit, run_id: $run_id, target: $target, scan_configuration_sha256: $configuration}' "${evidence_root}/build-provenance.json" > "${evidence_root}/build-provenance.checked.json"
          mv "${evidence_root}/build-provenance.checked.json" "${evidence_root}/build-provenance.json"

      - name: Upload verification dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-health-verify-${{ env.VARIANT_KEY }}
          path: ${{ runner.temp }}/dependency-health-${{ env.VARIANT_KEY }}
          if-no-files-found: error

      - name: Prune stale persistent verify builder cache
        if: always()
        env:
          BASELINE_ROOT: ${{ runner.temp }}/odoo-docker-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
        run: |
          set -euo pipefail
          rm -rf "${BASELINE_ROOT}"
          docker buildx prune \
            --builder "${{ steps.setup_buildx_verify.outputs.name }}" \
            --force \
            --filter 'until=168h' \
            --keep-storage 60000000000 \
            || true

  image_verification:
    name: image-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [dockerfile-lint, resolve_source, resolve_inputs, verify]
    if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/launchplane/train/'))
    permissions:
      contents: read
    steps:
      - name: Require successful image verification
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          DOCKERFILE_LINT_RESULT: ${{ needs.dockerfile-lint.result }}
          RESOLVE_SOURCE_RESULT: ${{ needs.resolve_source.result }}
          RESOLVE_INPUTS_RESULT: ${{ needs.resolve_inputs.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          if [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "Fork pull requests cannot run trusted self-hosted image verification." >&2
            echo "Recreate the change on a branch in ${BASE_REPOSITORY} before merging." >&2
            exit 1
          fi

          for result in \
            "${DOCKERFILE_LINT_RESULT}" \
            "${RESOLVE_SOURCE_RESULT}" \
            "${RESOLVE_INPUTS_RESULT}" \
            "${VERIFY_RESULT}"
          do
            if [ "${result}" != "success" ]; then
              echo "Required image verification job concluded with: ${result}" >&2
              exit 1
            fi
          done

  publish:
    runs-on: [self-hosted, linux, x64, chris-testing-publish-cache]
    timeout-minutes: 240
    concurrency:
      group: odoo-docker-publish
      cancel-in-progress: false
      queue: max
    needs: [resolve_source, resolve_inputs, verify]
    if: ${{ !cancelled() && needs.resolve_source.result == 'success' && needs.resolve_inputs.result == 'success' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/launchplane/train/') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON(needs.resolve_source.outputs.variants) }}
        target: [runtime, runtime-devtools]
        include:
          - target: runtime
            suffix: runtime
          - target: runtime-devtools
            suffix: devtools
    env:
      ODOO_SERIES: ${{ matrix.variant.series }}
      ODOO_SOURCE_REV: ${{ fromJSON(needs.resolve_source.outputs.odoo_source_revs)[matrix.variant.series] }}
      ALIAS_PREFIX: ${{ matrix.variant.alias_prefix }}
      VARIANT_KEY: ${{ matrix.variant.series }}-${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download comparison inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dependency-health-inputs
          path: ${{ runner.temp }}/dependency-health-inputs

      - name: Download both verification proofs for this series
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dependency-health-verify-${{ matrix.variant.series }}-*
          path: ${{ runner.temp }}/verified-${{ env.VARIANT_KEY }}

      - name: Require both exact verified targets before publication
        id: verified_pair
        run: |
          set -euo pipefail
          for target in runtime runtime-devtools; do
            suffix="${target/runtime-devtools/devtools}"
            proof="${RUNNER_TEMP}/verified-${{ env.VARIANT_KEY }}/dependency-health-verify-${ODOO_SERIES}-${suffix}/build-provenance.json"
            jq -e --arg series "${ODOO_SERIES}" --arg revision "${ODOO_SOURCE_REV}" --arg commit "${GITHUB_SHA}" --arg run_id "${GITHUB_RUN_ID}" --arg target "${target}" --arg configuration "${{ needs.resolve_inputs.outputs.scan_configuration_sha256 }}" --slurpfile inputs "${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json" '.verification == {status: "pass", series: $series, odoo_source_revision: $revision, source_commit: $commit, run_id: $run_id, target: $target, scan_configuration_sha256: $configuration} and .resolved_inputs == $inputs[0]' "${proof}" >/dev/null
          done

      - name: Restore scanner database
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TEMP}/trivy-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ env.VARIANT_KEY }}"
          mkdir -p "${cache_root}"
          tar -C "${cache_root}" --strip-components=1 -xzf \
            "${RUNNER_TEMP}/dependency-health-inputs/trivy-cache.tar.gz"
          actual_db_sha256="$(cd "${cache_root}" \
            && find . -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | awk '{print $1}')"
          if [ "${actual_db_sha256}" != "${{ needs.resolve_inputs.outputs.trivy_db_sha256 }}" ]; then
            echo "Restored Trivy database digest does not match resolved inputs" >&2
            exit 1
          fi
          actual_configuration_sha256="$(sha256sum \
            "${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json" \
            | awk '{print $1}')"
          if [ "${actual_configuration_sha256}" != "${{ needs.resolve_inputs.outputs.scan_configuration_sha256 }}" ]; then
            echo "Restored scan configuration digest does not match resolved inputs" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3

      - id: setup_buildx_publish
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          name: odoo-docker-chris-testing
          cleanup: false
          keep-state: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate and promotion tag sets
        id: tags
        env:
          NIGHTLY_DATE: ${{ needs.resolve_source.outputs.nightly_date }}
          ODOO_SOURCE_REV: ${{ env.ODOO_SOURCE_REV }}
          DISPATCH_PUBLISH_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable || 'false' }}
        run: |
          set -euo pipefail
          source_short_sha="${ODOO_SOURCE_REV::12}"
          repository_short_sha="${GITHUB_SHA::12}"
          image_root="ghcr.io/${GITHUB_REPOSITORY}"
          candidate_tag="${image_root}:${ALIAS_PREFIX}candidate-${GITHUB_RUN_ID}-${repository_short_sha}-${{ matrix.suffix }}"
          aliases=(
            "${image_root}:${ALIAS_PREFIX}build-${GITHUB_RUN_ID}-${repository_short_sha}-${{ matrix.suffix }}"
            "${image_root}:${ALIAS_PREFIX}sha-${source_short_sha}-${{ matrix.suffix }}"
          )

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            aliases+=("${image_root}:${ALIAS_PREFIX}nightly-${{ matrix.suffix }}" "${image_root}:${ALIAS_PREFIX}nightly-${NIGHTLY_DATE}-${{ matrix.suffix }}")
          fi

          publish_stable="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            publish_stable="true"
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISPATCH_PUBLISH_STABLE}" = "true" ]; then
            publish_stable="true"
          fi

          if [ "${publish_stable}" = "true" ]; then
            aliases+=("${image_root}:${ODOO_SERIES}-${{ matrix.suffix }}")
          fi

          {
            echo "candidate=${candidate_tag}"
            echo "aliases<<EOF"
            printf '%s\n' "${aliases[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish image (attempt 1)
        id: publish_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.setup_buildx_publish.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.candidate }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant.alias_prefix }}${{ matrix.suffix }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant.alias_prefix }}${{ matrix.suffix }},mode=max
          outputs: type=image,oci-mediatypes=true
          annotations: |
            index,manifest:io.github.cbusillo.odoo-series=${{ matrix.variant.series }}
            index,manifest:io.github.cbusillo.odoo-source-revision=${{ env.ODOO_SOURCE_REV }}
            index,manifest:io.github.cbusillo.build-run-number=${{ github.run_number }}
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=${{ matrix.variant.series }}
            ODOO_SOURCE_REV=${{ env.ODOO_SOURCE_REV }}
            APT_REFRESH_EPOCH=${{ github.run_id }}
            APT_SNAPSHOT=${{ needs.resolve_inputs.outputs.apt_snapshot }}
            POSTGRESQL_CLIENT_COMMON_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_common_version }}
            POSTGRESQL_CLIENT_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_version }}
            POSTGRESQL_LIBPQ_VERSION=${{ needs.resolve_inputs.outputs.postgresql_libpq_version }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            RESOLVER_CUTOFF=${{ needs.resolve_inputs.outputs.resolver_cutoff }}

      - name: Refresh ghcr login before retry
        if: steps.publish_attempt_1.outcome == 'failure'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image (attempt 2)
        id: publish_attempt_2
        if: steps.publish_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.setup_buildx_publish.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.candidate }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant.alias_prefix }}${{ matrix.suffix }},mode=max
          outputs: type=image,oci-mediatypes=true
          annotations: |
            index,manifest:io.github.cbusillo.odoo-series=${{ matrix.variant.series }}
            index,manifest:io.github.cbusillo.odoo-source-revision=${{ env.ODOO_SOURCE_REV }}
            index,manifest:io.github.cbusillo.build-run-number=${{ github.run_number }}
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=${{ matrix.variant.series }}
            ODOO_SOURCE_REV=${{ env.ODOO_SOURCE_REV }}
            APT_REFRESH_EPOCH=${{ github.run_id }}
            APT_SNAPSHOT=${{ needs.resolve_inputs.outputs.apt_snapshot }}
            POSTGRESQL_CLIENT_COMMON_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_common_version }}
            POSTGRESQL_CLIENT_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_version }}
            POSTGRESQL_LIBPQ_VERSION=${{ needs.resolve_inputs.outputs.postgresql_libpq_version }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            RESOLVER_CUTOFF=${{ needs.resolve_inputs.outputs.resolver_cutoff }}

      - name: Refresh ghcr login before final retry
        if: steps.publish_attempt_1.outcome == 'failure' && steps.publish_attempt_2.outcome == 'failure'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image (attempt 3)
        id: publish_attempt_3
        if: steps.publish_attempt_1.outcome == 'failure' && steps.publish_attempt_2.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.setup_buildx_publish.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.candidate }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant.alias_prefix }}${{ matrix.suffix }}
          outputs: type=image,oci-mediatypes=true
          annotations: |
            index,manifest:io.github.cbusillo.odoo-series=${{ matrix.variant.series }}
            index,manifest:io.github.cbusillo.odoo-source-revision=${{ env.ODOO_SOURCE_REV }}
            index,manifest:io.github.cbusillo.build-run-number=${{ github.run_number }}
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=${{ matrix.variant.series }}
            ODOO_SOURCE_REV=${{ env.ODOO_SOURCE_REV }}
            APT_REFRESH_EPOCH=${{ github.run_id }}
            APT_SNAPSHOT=${{ needs.resolve_inputs.outputs.apt_snapshot }}
            POSTGRESQL_CLIENT_COMMON_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_common_version }}
            POSTGRESQL_CLIENT_VERSION=${{ needs.resolve_inputs.outputs.postgresql_client_version }}
            POSTGRESQL_LIBPQ_VERSION=${{ needs.resolve_inputs.outputs.postgresql_libpq_version }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            RESOLVER_CUTOFF=${{ needs.resolve_inputs.outputs.resolver_cutoff }}

      - name: Resolve exact published candidate digest
        id: published
        env:
          DIGEST_ATTEMPT_1: ${{ steps.publish_attempt_1.outputs.digest }}
          DIGEST_ATTEMPT_2: ${{ steps.publish_attempt_2.outputs.digest }}
          DIGEST_ATTEMPT_3: ${{ steps.publish_attempt_3.outputs.digest }}
          OUTCOME_ATTEMPT_1: ${{ steps.publish_attempt_1.outcome }}
          OUTCOME_ATTEMPT_2: ${{ steps.publish_attempt_2.outcome }}
          OUTCOME_ATTEMPT_3: ${{ steps.publish_attempt_3.outcome }}
          CANDIDATE_IMAGE: ${{ steps.tags.outputs.candidate }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail

          image_digest=""
          if [ "${OUTCOME_ATTEMPT_1}" = "success" ]; then
            image_digest="${DIGEST_ATTEMPT_1:-}"
          elif [ "${OUTCOME_ATTEMPT_2}" = "success" ]; then
            image_digest="${DIGEST_ATTEMPT_2:-}"
          elif [ "${OUTCOME_ATTEMPT_3}" = "success" ]; then
            image_digest="${DIGEST_ATTEMPT_3:-}"
          fi
          if [ -z "${image_digest}" ]; then
            echo "Published image digest was not reported by Buildx for ${SUFFIX}" >&2
            exit 1
          fi
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx reported an invalid digest for ${SUFFIX}: ${image_digest}" >&2
            exit 1
          fi

          evidence_root="${RUNNER_TEMP}/published-evidence/${ODOO_SERIES}/${SUFFIX}"
          mkdir -p "${evidence_root}"
          docker buildx imagetools inspect --raw "${CANDIDATE_IMAGE}" \
            >"${evidence_root}/manifest.json"
          registry_digest="sha256:$(sha256sum "${evidence_root}/manifest.json" | awk '{print $1}')"
          jq -e --arg source "https://github.com/${GITHUB_REPOSITORY}" --arg revision "${GITHUB_SHA}" --arg series "${ODOO_SERIES}" --arg odoo_revision "${ODOO_SOURCE_REV}" '
            .annotations["org.opencontainers.image.source"] == $source
            and .annotations["org.opencontainers.image.revision"] == $revision
            and .annotations["io.github.cbusillo.odoo-series"] == $series
            and .annotations["io.github.cbusillo.odoo-source-revision"] == $odoo_revision
          ' "${evidence_root}/manifest.json" >/dev/null

          if [ "${registry_digest}" != "${image_digest}" ]; then
            echo "Registry digest ${registry_digest} does not match Buildx digest ${image_digest}" >&2
            exit 1
          fi

          echo "digest=${registry_digest}" >>"${GITHUB_OUTPUT}"
          echo "evidence_root=${evidence_root}" >>"${GITHUB_OUTPUT}"

      - name: Scan exact published platform digests
        env:
          DEPENDENCY_HEALTH_REPOSITORY: ${{ github.repository }}
          EVIDENCE_ROOT: ${{ steps.published.outputs.evidence_root }}
          IMAGE_ROOT: ghcr.io/${{ github.repository }}
          MANIFEST_DIGEST: ${{ steps.published.outputs.digest }}
          ODOO_SOURCE_REV: ${{ env.ODOO_SOURCE_REV }}
          SCAN_CONFIGURATION_SHA256: ${{ needs.resolve_inputs.outputs.scan_configuration_sha256 }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.VARIANT_KEY }}
          TRIVY_DB_SHA256: ${{ needs.resolve_inputs.outputs.trivy_db_sha256 }}
          TRIVY_IMAGE: ${{ needs.resolve_inputs.outputs.trivy_image }}
          TRIVY_VERSION: ${{ needs.resolve_inputs.outputs.trivy_version }}
        run: |
          set -euo pipefail

          jq -cn \
            --slurpfile inputs "${RUNNER_TEMP}/dependency-health-inputs/comparison-inputs.json" \
            --arg buildx_version "$(docker buildx version)" \
            --arg docker_server_version "$(docker version --format '{{.Server.Version}}')" \
            --arg manifest_digest "${MANIFEST_DIGEST}" \
            --arg odoo_source_revision "${ODOO_SOURCE_REV}" \
            --arg repository_commit "${GITHUB_SHA}" \
            --arg source_dockerfile_sha256 "$(sha256sum Dockerfile | awk '{print $1}')" \
            --arg target "${{ matrix.target }}" \
            '{
              repository_commit: $repository_commit,
              odoo_source_revision: $odoo_source_revision,
              target: $target,
              platforms: ["linux/amd64", "linux/arm64"],
              manifest_digest: $manifest_digest,
              source_dockerfile_sha256: $source_dockerfile_sha256,
              buildx_version: $buildx_version,
              docker_server_version: $docker_server_version,
              resolved_inputs: $inputs[0]
            }' >"${EVIDENCE_ROOT}/build-provenance.json"

          mapfile -t platform_rows < <(jq -er '
            [.manifests[]
              | select(.platform.os == "linux")
              | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
              | [(.platform.os + "/" + .platform.architecture), .digest]
              | @tsv]
            | sort
            | .[]' "${EVIDENCE_ROOT}/manifest.json")
          if [ "${#platform_rows[@]}" -ne 2 ]; then
            echo "Published manifest must contain exactly amd64 and arm64 image manifests" >&2
            exit 1
          fi

          platform_snapshot_arguments=()
          pulled_file="${RUNNER_TEMP}/published-${{ env.VARIANT_KEY }}-pulled.txt"
          : > "${pulled_file}"
          for row in "${platform_rows[@]}"; do
            IFS=$'\t' read -r platform child_digest <<<"${row}"
            case "${platform}" in
              linux/amd64 | linux/arm64) ;;
              *) echo "Unexpected published platform: ${platform}" >&2; exit 1 ;;
            esac
            if [[ ! "${child_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid child digest for ${platform}: ${child_digest}" >&2
              exit 1
            fi
            platform_name="${platform#linux/}"
            platform_root="${EVIDENCE_ROOT}/${platform_name}"
            child_reference="${IMAGE_ROOT}@${child_digest}"
            scripts/scan-image-dependencies.sh \
              "${child_reference}" \
              "${GITHUB_SHA}" \
              "" \
              "${child_reference}#${platform}" \
              remote \
              "${platform_root}"
            docker buildx imagetools inspect --raw "${child_reference}" > "${platform_root}/manifest.json"
            jq -e --arg source "https://github.com/${GITHUB_REPOSITORY}" --arg revision "${GITHUB_SHA}" --arg series "${ODOO_SERIES}" --arg odoo_revision "${ODOO_SOURCE_REV}" '
              .annotations["org.opencontainers.image.source"] == $source
              and .annotations["org.opencontainers.image.revision"] == $revision
            and .annotations["io.github.cbusillo.odoo-series"] == $series
            and .annotations["io.github.cbusillo.odoo-source-revision"] == $odoo_revision
            ' "${platform_root}/manifest.json" >/dev/null
            if ! docker image inspect "${child_reference}" >/dev/null 2>&1; then
              printf '%s\n' "${child_reference}" >> "${pulled_file}"
            fi
            docker pull --platform "${platform}" "${child_reference}"
            DOCKER_DEFAULT_PLATFORM="${platform}" bash "scripts/smoke-${{ matrix.suffix }}.sh" "${child_reference}" "${ODOO_SERIES}"
            platform_snapshot_arguments+=(
              --platform-snapshot "${platform}=${platform_root}/snapshot.json"
            )
          done

          python3 scripts/image-dependency-health.py artifact-evidence \
            --repository "${GITHUB_REPOSITORY}" \
            --image "${IMAGE_ROOT}" \
            --parent-digest "${MANIFEST_DIGEST}" \
            --manifest-json "${EVIDENCE_ROOT}/manifest.json" \
            --build-provenance "${EVIDENCE_ROOT}/build-provenance.json" \
            "${platform_snapshot_arguments[@]}" \
            --output "${EVIDENCE_ROOT}/artifact-evidence.json"

      - name: Record published digest
        env:
          EVIDENCE_ROOT: ${{ steps.published.outputs.evidence_root }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
          ALIASES: ${{ steps.tags.outputs.aliases }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/published-digests/${ODOO_SERIES}"
          jq -cn \
            --arg series "${ODOO_SERIES}" \
            --arg odoo_source_revision "${ODOO_SOURCE_REV}" \
            --arg suffix "${SUFFIX}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg aliases "${ALIASES}" \
            --arg evidence_sha256 "$(sha256sum "${EVIDENCE_ROOT}/artifact-evidence.json" | awk '{print $1}')" \
            '{series: $series, odoo_source_revision: $odoo_source_revision, suffix: $suffix, digest: $digest, aliases: $aliases, absolute_evidence_sha256: $evidence_sha256}' \
            >"${RUNNER_TEMP}/published-digests/${ODOO_SERIES}/${SUFFIX}.json"

      - name: Upload published absolute evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-absolute-evidence-${{ env.VARIANT_KEY }}
          path: ${{ steps.published.outputs.evidence_root }}
          if-no-files-found: error

      - name: Upload published digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-digest-${{ env.VARIANT_KEY }}
          path: ${{ runner.temp }}/published-digests/${{ matrix.variant.series }}/${{ matrix.suffix }}.json
          if-no-files-found: error

      - name: Prune stale persistent publish builder cache
        if: always()
        run: |
          set -euo pipefail
          pulled_file="${RUNNER_TEMP}/published-${{ env.VARIANT_KEY }}-pulled.txt"
          if [ -f "${pulled_file}" ]; then
            while IFS= read -r reference; do
              docker image rm "${reference}" || true
            done < "${pulled_file}"
          fi
          docker buildx prune \
            --builder "${{ steps.setup_buildx_publish.outputs.name }}" \
            --force \
            --filter 'until=168h' \
            --keep-storage 60000000000 \
            || true

  trigger_enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: odoo-docker-publish
      cancel-in-progress: false
      queue: max
    needs: [resolve_source, resolve_inputs, publish]
    if: ${{ !cancelled() && needs.resolve_source.result == 'success' && needs.resolve_inputs.result == 'success' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/launchplane/train/') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.resolve_source.outputs.variants) }}
    env:
      ODOO_SERIES: ${{ matrix.variant.series }}
      ODOO_SOURCE_REV: ${{ fromJSON(needs.resolve_source.outputs.odoo_source_revs)[matrix.variant.series] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download published digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: published-digest-${{ matrix.variant.series }}-*
          path: ${{ runner.temp }}/published-digests/${{ matrix.variant.series }}
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote checked image pair
        id: promote_aliases
        run: python3 scripts/promote-published-images.py "${RUNNER_TEMP}/published-digests/${ODOO_SERIES}" --series "${ODOO_SERIES}" --odoo-source-revision "${ODOO_SOURCE_REV}"

      - name: Trigger enterprise build
        if: matrix.variant.enterprise_followup && steps.promote_aliases.outputs.dispatch == 'true'
        env:
          ODOO_SOURCE_REV: ${{ env.ODOO_SOURCE_REV }}
          RUNTIME_DIGEST: ${{ steps.promote_aliases.outputs.runtime_digest }}
          DEVTOOLS_DIGEST: ${{ steps.promote_aliases.outputs.devtools_digest }}
          DISPATCH_TOKEN: ${{ secrets.ENTERPRISE_REPO_DISPATCH_TOKEN }}
          DISPATCH_PUBLISH_NIGHTLY: ${{ steps.promote_aliases.outputs.nightly }}
          DISPATCH_PUBLISH_STABLE: ${{ steps.promote_aliases.outputs.stable }}
        run: |
          set -euo pipefail

          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "Missing ENTERPRISE_REPO_DISPATCH_TOKEN secret" >&2
            exit 1
          fi

          image_root="ghcr.io/${GITHUB_REPOSITORY}"

          runtime_image="${image_root}@${RUNTIME_DIGEST}"
          devtools_image="${image_root}@${DEVTOOLS_DIGEST}"
          enterprise_repository="${GITHUB_REPOSITORY_OWNER}/odoo-enterprise-docker"

          request_payload="$(jq -cn \
            --arg ref "main" \
            --arg runtime "${runtime_image}" \
            --arg devtools "${devtools_image}" \
            --arg nightly "${DISPATCH_PUBLISH_NIGHTLY}" \
            --arg stable "${DISPATCH_PUBLISH_STABLE}" \
            '{
              ref: $ref,
              inputs: {
                publish_nightly: $nightly,
                publish_stable: $stable,
                base_runtime_image: $runtime,
                base_devtools_image: $devtools
              }
            }')"

          max_dispatch_attempts=3
          dispatch_attempt=1

          while true; do
            if curl --fail --show-error --silent \
              --connect-timeout 15 \
              --max-time 60 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${enterprise_repository}/actions/workflows/build.yml/dispatches" \
              -d "${request_payload}"; then
              echo "Enterprise dispatch succeeded on attempt ${dispatch_attempt}" >&2
              break
            fi

            if [ "${dispatch_attempt}" -ge "${max_dispatch_attempts}" ]; then
              echo "Enterprise dispatch failed after ${max_dispatch_attempts} attempts" >&2
              exit 1
            fi

            backoff_seconds=$((dispatch_attempt * 10))
            echo "Enterprise dispatch attempt ${dispatch_attempt} failed; retrying in ${backoff_seconds}s" >&2
            sleep "${backoff_seconds}"
            dispatch_attempt=$((dispatch_attempt + 1))
          done
