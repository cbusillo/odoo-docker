name: Build And Publish Images

on:
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish stable 19.0 tags in addition to sha/nightly tags.
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - requirements-overrides.txt
      - scripts/**
      - .github/workflows/build.yml
      - README.md
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements-overrides.txt
      - scripts/**
      - .github/workflows/build.yml
      - README.md
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: odoo-docker-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  resolve_source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      odoo_source_rev: ${{ steps.odoo_source.outputs.value }}
    steps:
      - name: Resolve Odoo source revision
        id: odoo_source
        run: |
          set -euo pipefail
          source_revision="$(git ls-remote https://github.com/odoo/odoo.git refs/heads/19.0 | awk '{print $1}')"
          if [ -z "${source_revision}" ]; then
            echo "Failed to resolve Odoo source revision" >&2
            exit 1
          fi
          echo "value=${source_revision}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Odoo source revision: ${source_revision}"

  check_overrides:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: resolve_source
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install requirement parser
        run: python3 -m pip install --user packaging

      - name: Check requirement overrides against upstream
        env:
          ODOO_SOURCE_REV: ${{ needs.resolve_source.outputs.odoo_source_rev }}
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/odoo/odoo/${ODOO_SOURCE_REV}/requirements.txt" \
            -o "${RUNNER_TEMP}/odoo-requirements.txt"
          python3 scripts/check-requirements-overrides.py \
            --requirements "${RUNNER_TEMP}/odoo-requirements.txt" \
            --overrides requirements-overrides.txt \
            --python-version 3.13

  verify:
    runs-on: [self-hosted, linux, x64, chris-testing-build]
    timeout-minutes: 60
    needs: [resolve_source, check_overrides]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: runtime
            suffix: runtime
            smoke_script: scripts/smoke-runtime.sh
          - target: runtime-devtools
            suffix: devtools
            smoke_script: scripts/smoke-devtools.sh
    steps:
      - uses: actions/checkout@v6

      - name: Resolve persistent verify builder name
        id: verify_builder
        run: |
          set -euo pipefail
          echo "name=odoo-docker-chris-testing" >> "${GITHUB_OUTPUT}"

      - id: setup_buildx_verify
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: ${{ steps.verify_builder.outputs.name }}
          cleanup: false
          keep-state: true

      - name: Validate odoo-bin wrapper behavior
        run: scripts/test-odoo-bin-wrapper.sh

      - name: Build verification image (attempt 1)
        id: verify_build_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup_buildx_verify.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          load: true
          platforms: linux/amd64
          tags: odoo-docker:verify-${{ matrix.suffix }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=19.0
            ODOO_SOURCE_REV=${{ needs.resolve_source.outputs.odoo_source_rev }}

      - name: Build verification image (attempt 2, no cache import)
        id: verify_build_attempt_2
        if: steps.verify_build_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup_buildx_verify.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          load: true
          no-cache: true
          platforms: linux/amd64
          tags: odoo-docker:verify-${{ matrix.suffix }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=19.0
            ODOO_SOURCE_REV=${{ needs.resolve_source.outputs.odoo_source_rev }}

      - name: Fail verification build after retries
        if: steps.verify_build_attempt_1.outcome == 'failure' && steps.verify_build_attempt_2.outcome == 'failure'
        run: |
          echo "Verification build failed after two attempts" >&2
          exit 1

      - name: Smoke test verification image
        run: ${{ matrix.smoke_script }} odoo-docker:verify-${{ matrix.suffix }}

      - name: Smoke test database initialization
        if: matrix.target == 'runtime'
        run: scripts/smoke-db-init.sh odoo-docker:verify-runtime

      - name: Validate downstream helper contract
        if: matrix.target == 'runtime'
        run: scripts/test-downstream-helpers.sh odoo-docker:verify-runtime

      - name: Scan verification image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache" \
            aquasec/trivy:0.70.0 image \
            --scanners vulnerability \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            odoo-docker:verify-${{ matrix.suffix }}

      - name: Prune stale persistent verify builder cache
        if: always()
        run: |
          set -euo pipefail
          docker buildx prune \
            --builder "${{ steps.setup_buildx_verify.outputs.name }}" \
            --force \
            --filter 'until=168h' \
            --keep-storage 60000000000 \
            || true

  publish:
    runs-on: [self-hosted, linux, x64, chris-testing-publish-cache]
    timeout-minutes: 240
    needs: [resolve_source, verify]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: runtime
            suffix: runtime
          - target: runtime-devtools
            suffix: devtools
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
        with:
          image: docker.io/tonistiigi/binfmt@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3

      - name: Resolve persistent publish builder name
        id: publish_builder
        run: |
          set -euo pipefail
          echo "name=odoo-docker-chris-testing" >> "${GITHUB_OUTPUT}"

      - id: setup_buildx_publish
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          name: ${{ steps.publish_builder.outputs.name }}
          cleanup: false
          keep-state: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag set
        id: tags
        env:
          ODOO_SOURCE_REV: ${{ needs.resolve_source.outputs.odoo_source_rev }}
          DISPATCH_PUBLISH_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable || 'false' }}
        run: |
          set -euo pipefail
          source_short_sha="${ODOO_SOURCE_REV::12}"
          nightly_date="$(date -u +%Y%m%d)"
          image_root="ghcr.io/${GITHUB_REPOSITORY}"

          tags=("${image_root}:sha-${source_short_sha}-${{ matrix.suffix }}")

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            tags+=("${image_root}:nightly-${{ matrix.suffix }}" "${image_root}:nightly-${nightly_date}-${{ matrix.suffix }}")
          fi

          publish_stable="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            publish_stable="true"
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISPATCH_PUBLISH_STABLE}" = "true" ]; then
            publish_stable="true"
          fi

          if [ "${publish_stable}" = "true" ]; then
            tags+=("${image_root}:19.0-${{ matrix.suffix }}")
          fi

          {
            echo "value<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish image (attempt 1)
        id: publish_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup_buildx_publish.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.suffix }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.suffix }},mode=max
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=19.0
            ODOO_SOURCE_REV=${{ needs.resolve_source.outputs.odoo_source_rev }}

      - name: Refresh ghcr login before retry
        if: steps.publish_attempt_1.outcome == 'failure'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image (attempt 2)
        id: publish_attempt_2
        if: steps.publish_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup_buildx_publish.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.suffix }},mode=max
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=19.0
            ODOO_SOURCE_REV=${{ needs.resolve_source.outputs.odoo_source_rev }}

      - name: Refresh ghcr login before final retry
        if: steps.publish_attempt_1.outcome == 'failure' && steps.publish_attempt_2.outcome == 'failure'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image (attempt 3)
        id: publish_attempt_3
        if: steps.publish_attempt_1.outcome == 'failure' && steps.publish_attempt_2.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.setup_buildx_publish.outputs.name }}
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.suffix }}
          provenance: false
          sbom: false
          build-args: |
            ODOO_SOURCE_REF=19.0
            ODOO_SOURCE_REV=${{ needs.resolve_source.outputs.odoo_source_rev }}

      - name: Record published digest
        env:
          DIGEST_ATTEMPT_1: ${{ steps.publish_attempt_1.outputs.digest }}
          DIGEST_ATTEMPT_2: ${{ steps.publish_attempt_2.outputs.digest }}
          DIGEST_ATTEMPT_3: ${{ steps.publish_attempt_3.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail

          image_digest="${DIGEST_ATTEMPT_1:-}"
          if [ -z "${image_digest}" ]; then
            image_digest="${DIGEST_ATTEMPT_2:-}"
          fi
          if [ -z "${image_digest}" ]; then
            image_digest="${DIGEST_ATTEMPT_3:-}"
          fi
          if [ -z "${image_digest}" ]; then
            echo "Published image digest was not reported by Buildx for ${SUFFIX}" >&2
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/published-digests"
          jq -cn \
            --arg suffix "${SUFFIX}" \
            --arg digest "${image_digest}" \
            '{suffix: $suffix, digest: $digest}' \
            >"${RUNNER_TEMP}/published-digests/${SUFFIX}.json"

      - name: Upload published digest
        uses: actions/upload-artifact@v4
        with:
          name: published-digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/published-digests/${{ matrix.suffix }}.json
          if-no-files-found: error

      - name: Prune stale persistent publish builder cache
        if: always()
        run: |
          set -euo pipefail
          docker buildx prune \
            --builder "${{ steps.setup_buildx_publish.outputs.name }}" \
            --force \
            --filter 'until=168h' \
            --keep-storage 60000000000 \
            || true

  trigger_enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve_source, publish]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download published digests
        uses: actions/download-artifact@v4
        with:
          pattern: published-digest-*
          path: ${{ runner.temp }}/published-digests
          merge-multiple: true

      - name: Trigger enterprise build
        env:
          ODOO_SOURCE_REV: ${{ needs.resolve_source.outputs.odoo_source_rev }}
          DISPATCH_TOKEN: ${{ secrets.ENTERPRISE_REPO_DISPATCH_TOKEN }}
          DISPATCH_PUBLISH_NIGHTLY: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          DISPATCH_PUBLISH_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "Missing ENTERPRISE_REPO_DISPATCH_TOKEN secret" >&2
            exit 1
          fi

          image_root="ghcr.io/${GITHUB_REPOSITORY}"

          read_published_digest() {
            local suffix="$1"
            local digest_file="${RUNNER_TEMP}/published-digests/${suffix}.json"
            local digest

            if [ ! -s "${digest_file}" ]; then
              echo "Missing published digest metadata for ${suffix}: ${digest_file}" >&2
              exit 1
            fi
            digest="$(jq -er '.digest' "${digest_file}")"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "Invalid published digest metadata for ${suffix}: ${digest}" >&2
              exit 1
            fi
            printf '%s\n' "${digest}"
          }

          runtime_digest="$(read_published_digest runtime)"
          devtools_digest="$(read_published_digest devtools)"

          runtime_image="${image_root}@${runtime_digest}"
          devtools_image="${image_root}@${devtools_digest}"
          enterprise_repository="${GITHUB_REPOSITORY_OWNER}/odoo-enterprise-docker"

          publish_stable="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            publish_stable="true"
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISPATCH_PUBLISH_STABLE}" = "true" ]; then
            publish_stable="true"
          fi

          request_payload="$(jq -cn \
            --arg ref "main" \
            --arg runtime "${runtime_image}" \
            --arg devtools "${devtools_image}" \
            --arg nightly "${DISPATCH_PUBLISH_NIGHTLY}" \
            --arg stable "${publish_stable}" \
            '{
              ref: $ref,
              inputs: {
                publish_nightly: $nightly,
                publish_stable: $stable,
                base_runtime_image: $runtime,
                base_devtools_image: $devtools
              }
            }')"

          max_dispatch_attempts=3
          dispatch_attempt=1

          while true; do
            if curl --fail --show-error --silent \
              --connect-timeout 15 \
              --max-time 60 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${enterprise_repository}/actions/workflows/build.yml/dispatches" \
              -d "${request_payload}"; then
              echo "Enterprise dispatch succeeded on attempt ${dispatch_attempt}" >&2
              break
            fi

            if [ "${dispatch_attempt}" -ge "${max_dispatch_attempts}" ]; then
              echo "Enterprise dispatch failed after ${max_dispatch_attempts} attempts" >&2
              exit 1
            fi

            backoff_seconds=$((dispatch_attempt * 10))
            echo "Enterprise dispatch attempt ${dispatch_attempt} failed; retrying in ${backoff_seconds}s" >&2
            sleep "${backoff_seconds}"
            dispatch_attempt=$((dispatch_attempt + 1))
          done
