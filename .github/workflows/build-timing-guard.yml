---
name: Build Timing Guard

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to inspect when manually checking a prior build run.
        required: false
        default: main
        type: string
      event_name:
        description: Optional event filter for manual checks.
        required: false
        default: push
        type: string
  workflow_run:
    workflows: [Build And Publish Images]
    types: [completed]

jobs:
  check_timing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Evaluate build timing budget
        uses: actions/github-script@v9
        env:
          MAX_RUN_DURATION_SECONDS: "5400"
          MAX_VERIFY_JOB_DURATION_SECONDS: "2400"
          MAX_RUNTIME_PUBLISH_JOB_DURATION_SECONDS: "1800"
          MAX_DEVTOOLS_PUBLISH_JOB_DURATION_SECONDS: "2700"
        with:
          script: |
            const monitoredWorkflowName = 'Build And Publish Images';
            const monitoredWorkflowId = 'build.yml';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const manualInputs = context.payload.inputs || {};

            const thresholds = {
              run: Number(process.env.MAX_RUN_DURATION_SECONDS),
              verify: Number(process.env.MAX_VERIFY_JOB_DURATION_SECONDS),
              publishRuntime: Number(
                process.env.MAX_RUNTIME_PUBLISH_JOB_DURATION_SECONDS,
              ),
              publishDevtools: Number(
                process.env.MAX_DEVTOOLS_PUBLISH_JOB_DURATION_SECONDS,
              ),
            };

            function formatDuration(totalSeconds) {
              const hours = Math.floor(totalSeconds / 3600);
              const minutes = Math.floor((totalSeconds % 3600) / 60);
              const seconds = totalSeconds % 60;
              return [hours, minutes, seconds]
                .map((value) => String(value).padStart(2, '0'))
                .join(':');
            }

            function durationSeconds(startedAt, completedAt) {
              const elapsedMilliseconds =
                Date.parse(completedAt) - Date.parse(startedAt);
              return Math.max(0, Math.round(elapsedMilliseconds / 1000));
            }

            async function getRun() {
              if (context.eventName === 'workflow_run') {
                return context.payload.workflow_run;
              }

              const branchFilter = manualInputs.branch || 'main';
              const eventFilter = manualInputs.event_name || 'push';
              const runFilters = {
                owner,
                repo,
                workflow_id: monitoredWorkflowId,
                branch: branchFilter,
                per_page: 100,
                status: 'completed',
              };

              if (eventFilter !== '') {
                runFilters.event = eventFilter;
              }

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                runFilters,
              );

              const match = runs.find(
                (run) =>
                  run.name === monitoredWorkflowName && run.conclusion === 'success',
              );
              if (!match) {
                const filterDescription = eventFilter === ''
                  ? `branch ${branchFilter}`
                  : `branch ${branchFilter} event ${eventFilter}`;
                core.setFailed(
                  `Could not find a successful ${monitoredWorkflowName} run for ${filterDescription}.`,
                );
                return null;
              }
              return match;
            }

            const run = await getRun();
            if (!run) {
              return;
            }

            if (run.name !== monitoredWorkflowName) {
              core.info(`Skipping run ${run.id} because it is ${run.name}.`);
              return;
            }

            if (run.conclusion !== 'success') {
              core.info(
                `Skipping timing budget for run ${run.id} because conclusion is ${run.conclusion}.`,
              );
              return;
            }

            if (!run.run_started_at || !run.updated_at) {
              core.setFailed(`Run ${run.id} does not have complete timing data.`);
              return;
            }

            const runDuration = durationSeconds(
              run.run_started_at,
              run.updated_at,
            );

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              },
            );

            const timedJobs = jobs
              .filter((job) => job.started_at && job.completed_at)
              .map((job) => ({
                name: job.name,
                duration: durationSeconds(job.started_at, job.completed_at),
              }));

            const slowJobs = [];
            const verifyJobs = timedJobs.filter((job) =>
              job.name.startsWith('verify ('),
            );
            const runtimePublishJob = timedJobs.find(
              (job) => job.name === 'publish (runtime, runtime)',
            );
            const devtoolsPublishJob = timedJobs.find(
              (job) => job.name === 'publish (runtime-devtools, devtools)',
            );

            if (run.event !== 'pull_request' && !runtimePublishJob) {
              core.setFailed(
                `Successful run ${run.id} did not expose the runtime publish job.`,
              );
              return;
            }

            if (run.event !== 'pull_request' && !devtoolsPublishJob) {
              core.setFailed(
                `Successful run ${run.id} did not expose the devtools publish job.`,
              );
              return;
            }

            if (runDuration > thresholds.run) {
              slowJobs.push(
                `overall run ${formatDuration(runDuration)} > ${formatDuration(thresholds.run)}`,
              );
            }

            for (const job of verifyJobs) {
              if (job.duration > thresholds.verify) {
                slowJobs.push(
                  `${job.name} ${formatDuration(job.duration)} > ${formatDuration(thresholds.verify)}`,
                );
              }
            }

            if (runtimePublishJob && runtimePublishJob.duration > thresholds.publishRuntime) {
              slowJobs.push(
                `${runtimePublishJob.name} ${formatDuration(runtimePublishJob.duration)} > ${formatDuration(thresholds.publishRuntime)}`,
              );
            }

            if (devtoolsPublishJob && devtoolsPublishJob.duration > thresholds.publishDevtools) {
              slowJobs.push(
                `${devtoolsPublishJob.name} ${formatDuration(devtoolsPublishJob.duration)} > ${formatDuration(thresholds.publishDevtools)}`,
              );
            }

            const summaryLines = [
              `## ${monitoredWorkflowName} timing`,
              '',
              `- Run ID: ${run.id}`,
              `- Event: ${run.event}`,
              `- Conclusion: ${run.conclusion}`,
              `- Total duration: ${formatDuration(runDuration)}`,
              '',
              '| Job | Duration | Budget |',
              '| --- | --- | --- |',
            ];

            for (const job of verifyJobs) {
              summaryLines.push(
                `| ${job.name} | ${formatDuration(job.duration)} | ${formatDuration(thresholds.verify)} |`,
              );
            }

            if (runtimePublishJob) {
              summaryLines.push(
                `| ${runtimePublishJob.name} | ${formatDuration(runtimePublishJob.duration)} | ${formatDuration(thresholds.publishRuntime)} |`,
              );
            }

            if (devtoolsPublishJob) {
              summaryLines.push(
                `| ${devtoolsPublishJob.name} | ${formatDuration(devtoolsPublishJob.duration)} | ${formatDuration(thresholds.publishDevtools)} |`,
              );
            }

            summaryLines.push(
              `| overall run | ${formatDuration(runDuration)} | ${formatDuration(thresholds.run)} |`,
            );
            await core.summary.addRaw(summaryLines.join('\n')).write();

            if (slowJobs.length) {
              core.setFailed(`Build timing drift detected: ${slowJobs.join('; ')}`);
              return;
            }

            core.info(
              `Run ${run.id} stayed within the warm-cache timing budget.`,
            );
